name: Node package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['codex/release-v*']
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve the existing release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == codex/release-v* ]]; then
            tag="${GITHUB_REF_NAME#codex/release-}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
        node: ['22.13.0', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify test runtime matches the release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: git diff --exit-code "$RELEASE_TAG" -- server src vendor assets index.html styles.css package.json package-lock.json extensions/vscode
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use canonical temporary paths for fixtures
        shell: bash
        run: |
          mkdir -p output/test-tmp
          test_tmp=$(node -p "require('node:fs').realpathSync('output/test-tmp')")
          for variable in TMPDIR TEMP TMP; do echo "$variable=$test_tmp" >> "$GITHUB_ENV"; done
      - name: Run npm test
        shell: bash
        run: |
          npm pkg set "scripts.test=$(node -p "require('./package.json').scripts.test.replace('node --test ', 'node --test --test-concurrency=1 --test-reporter=tap ')")"
          if npm test > "$RUNNER_TEMP/codecity-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/codecity-tests.log"
            git restore package.json
          else
            cat "$RUNNER_TEMP/codecity-tests.log"
            details=$(awk '/^not ok /{printing=1} printing{print} printing && /^  \.\.\./{printing=0}' "$RUNNER_TEMP/codecity-tests.log")
            if [[ -z "$details" ]]; then details=$(tail -n 100 "$RUNNER_TEMP/codecity-tests.log"); fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=CodeCity test failures::$details"
            exit 1
          fi
      - name: Verify Windows installer branches
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer.windows.ps1
      - run: mkdir -p output && npm pack --pack-destination output
        shell: bash
      - name: Smoke test packaged launcher
        shell: bash
        run: |
          if {
            npm install --prefix output/smoke --omit=dev --no-audit --no-fund ./output/codecity-viewer-*.tgz &&
            node output/smoke/node_modules/codecity-viewer/server/cli.cjs --help
          } > "$RUNNER_TEMP/codecity-smoke.log" 2>&1; then
            cat "$RUNNER_TEMP/codecity-smoke.log"
          else
            details=$(tail -n 30 "$RUNNER_TEMP/codecity-smoke.log")
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Packaged launcher failure::$details"
            exit 1
          fi
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh && sh -n scripts/uninstall.sh
  package:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm pack && mv codecity-viewer-*.tgz codecity-viewer.tgz
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: codecity-node-package
          path: |
            codecity-viewer.tgz
            extensions/vscode/*.vsix
            scripts/install.ps1
            scripts/install.sh
            scripts/uninstall.ps1
            scripts/uninstall.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: CodeCity ${{ needs.version.outputs.tag }}
          body_path: docs/releases/${{ needs.version.outputs.tag }}.md
          make_latest: true
          files: |
            codecity-viewer.tgz
            extensions/vscode/*.vsix
            scripts/install.ps1
            scripts/install.sh
            scripts/uninstall.ps1
            scripts/uninstall.sh
