name: Node package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.13.0', '24', 'node']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Windows installer branches
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer.windows.ps1
      - run: mkdir -p output && npm pack --pack-destination output
        shell: bash
      - name: Smoke test packaged launcher
        shell: bash
        run: |
          npm install --prefix output/smoke --omit=dev --no-audit --no-fund output/codecity-viewer-*.tgz
          node output/smoke/node_modules/codecity-viewer/server/cli.cjs --help
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm pack && mv codecity-viewer-*.tgz codecity-viewer.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: codecity-node-package
          path: |
            codecity-viewer.tgz
            scripts/install.ps1
            scripts/install.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            codecity-viewer.tgz
            scripts/install.ps1
            scripts/install.sh
